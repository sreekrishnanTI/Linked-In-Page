<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn</title>
    <link rel="icon" href="photos\icons\5bukxbhy9xsil5mb7c2wulfbx.svg" type="image/svg+xml">

</head>

    <header>
        <nav class="navbar">

                <div id="box1"> 
                <div>
                    <img src="photos\icons\house-chimney.png" alt="Home" width="25" height="25" style="filter: invert(90%) sepia(100%) saturate(0%) hue-rotate(200deg);">

                </div> 
            </div>
                <div id="box2">
                    <div>
                    <img src="photos\icons\users.png" alt="users" width="25" height="25" style="filter: invert(90%) sepia(100%) saturate(0%) hue-rotate(200deg);">
                    <p>My Network</p>
                </div> 
                </div>
                <div id="box3">
                    <div>

                    <p>Jobs</p>
                </div> 
                </div>
                <div id="box4">
                    <div>

                    <p>Messaging</p>
                </div> 
                </div>
                <div id="box5">
                    <div>
                    <img src="photos\icons\bell.png" alt="bell  " width="25" height="25" style="filter: invert(90%) sepia(100%) saturate(0%) hue-rotate(200deg);">
                    <p>Notification</p>
                </div> 
                </div>
                <div id="box6">
                    <div>
                    <img src="photos\icons\circle-user.png" alt="circle-user" width="25" height="25" style="filter: invert(90%) sepia(100%) saturate(0%) hue-rotate(200deg);">
                    <div class="order-to-row">
                        <div>
                            <p>Me</p>
                        </div>
                        <div>
                            <img src="photos\icons\caret-down.png" alt="caret-down" width="15" height="15" style="filter: invert(90%) sepia(100%) saturate(0%) hue-rotate(200deg);">
                        </div>
                    </div>
                </div> 
                </div>
                <hr id="line1">
                <div id="box6">
                    <div>
                    <img src="photos\icons\grip-vertical.png" alt="grip-vertical" width="25" height="25" style="filter: invert(90%) sepia(100%) saturate(0%) hue-rotate(200deg);">
                    <div class="order-to-row">
                        <div>
                            <p>For Business</p>
                        </div>
                        <div>
                            <img src="photos\icons\caret-down.png" alt="caret-down" width="15" height="15" style="filter: invert(90%) sepia(100%) saturate(0%) hue-rotate(200deg);">
                        </div>
                    </div>
                </div> 
                </div>
                <div id="box7">
                    <div>
                    <img src="photos\icons\online-video.png" alt="grip-vertical" width="30" height="25" style="filter: invert(90%) sepia(100%) saturate(0%) hue-rotate(200deg);">
                    <p>My Network</p>
                </div> 
                </div>
            </div>

        </nav>

    <div id="container">

            <div class="profile">

                    <img src="photos/icons/circle-user.png" alt="user-png" width="64" height="64" style="filter: invert(90%) sepia(100%) saturate(0%) hue-rotate(2000deg);" class="dp-png">
                    <div class="text-box">
                        <h4 id="username">
                            Sreekrishnan T I
                        </h4>
                        <p id="des">
                            Aspiring Full-Stack Developer | Photo & Video Editing | Passionate About Programming 
                        </p>
                        <p id="des1">
                            Thrissur, Kerala
                        </p>
                    </div>
                </div>
            </div>
            <div class="item-box">
                <div class="color-box">
                    <div id="saved">
                        <a href="#" style="color: white; text-decoration: none;">
                            <img src="photos/icons/bookmark.png" alt="bookmark" width="25" height="25" style="filter: invert(90%) sepia(100%) saturate(0%) hue-rotate(200deg); margin-top:0.5vh;">    Saved items
                        </a>
                    </div>
                    <div>
                        <a href="#" style= " color:white ; text-decoration: none; margin-left: 1vw">
                            <img src="photos/icons/coworking.png" alt="coworking" width="25" height="25" style="filter: invert(90%) sepia(100%) saturate(0%) hue-rotate(200deg); margin-top:0.5vh;">  Group
                        </a>
                    </div>
                    <div>
                        <a href="#" style= " color:white ; text-decoration: none; margin-left: 1vw">
                            <img src="photos/icons/newsletter-subscribe.png" alt="newsletter-subscribe" width="25" height="25" style="filter: invert(90%) sepia(100%) saturate(0%) hue-rotate(200deg); margin-top:0.5vh;">  Newsletter

                    </div>
                    <div>
                        <a href="#" style= " color:white ; text-decoration: none; margin-left: 1vw">

                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div id="center"> 
            <div id="uper">
                <div id="order1">
                    <div id="user-pic">
                        <img src="photos\icons\circle-user.png" alt="circle-user" width="50px" height="50px"  style=" padding: 1rem 0rem 0rem 1rem; filter: invert(90%) sepia(100%) saturate(0%) hue-rotate(200deg);">
                    </div>
                        <div>
                            <input type="search" placeholder="Start a post" id="search-box" dir="auto" style="padding : 0.5rem; margin-top: 2vh; border-radius: 1rem; width: 29vw; background-color: rgba(240, 248, 255, 0); border: 2px solid rgb(93, 93, 93);">
                        </div>
                </div>
                <div id="order2">
                    <div>
                        <button class="btn">
                            <img src="photos/icons/youtube.png" alt="youtube" width="25px" height="25px" style=" filter: invert(64%) sepia(36%) saturate(650%) hue-rotate(72deg) brightness(92%) contrast(93%);">
                            <a href="#" class="stylet">Video</a>
                        </button>
                    </div>
                    <div>
                        <button class="btn">
                            <img src="photos/icons/picture.png" alt="picture" width="25px" height="25px" style=" filter: invert(68%) sepia(14%) saturate(1850%) hue-rotate(178deg) brightness(103%) contrast(92%);" >

                        </button>
                    </div>
                    <div>

                            <img src="photos/icons/calendar-day.png" alt="youtube" width="25px" height="25px" style="filter: invert(78%) sepia(59%) saturate(560%) hue-rotate(330deg) brightness(105%) contrast(95%);">
                            <a href="#"class="stylet">Write Article</a>

                </div>

            </div>
